name: CI Pipeline - AI Response Validation System

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint-and-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/ tests/ scripts/

      - name: Run Pytest Test Suite
        env:
          GROQ_API_KEY: "dummy-key-for-mocked-ci"
        run: |
          pytest tests/ -v --cov=backend/core --cov=backend/api --cov-report=term-missing

  frontend-lint-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Static Production Assets
        run: npm run build

  docker-build-check:
    name: Docker Container Smoke Build
    runs-on: ubuntu-latest
    needs: [python-lint-and-test, frontend-lint-and-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Unified Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ai-response-validation-system:ci-test

